[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypowercpp"
version = "0.1.0"
description = "Discrete power-law fitting a la Clauset-Shalizi-Newman (pure-Python port of poweRcpp)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Angel Luis Robles Fernandez", email = "a.l.robles.fernandez@gmail.com" },
]
keywords = ["power-law", "heavy-tail", "goodness-of-fit", "kolmogorov-smirnov", "discrete-distributions"]
dependencies = ["numpy", "scipy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://github.com/alrobles/pypowercpp" }

[project.optional-dependencies]
dev = ["pytest", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
